# /etc/nginx/sites-available/mpa.tomorrow.services
#
# ⚠ USE-WHEN: deploying to a PLAIN nginx server (no Laravel Forge).
# The mpa.tomorrow.services production server is Forge-managed, and uses
# deploy/forge-site.conf instead. That file gets dropped into Forge's
# per-site include path, NOT into sites-available.
#
# This file is the standalone equivalent — a complete server { } block you
# can copy into /etc/nginx/sites-available/ on any vanilla Ubuntu nginx box.
# Pair it with `sudo certbot --nginx -d <your-domain>` for SSL.
#
# nginx server block for the Medical Profile Assistant (MPA).
#
# What this site exposes:
#   GET  /                              → sdk/example.html  (live SDK demo)
#   GET  /sdk/mpa-sdk.js                → sdk/mpa-sdk.js    (the SDK Seraph loads)
#   GET  /mock-seraph/schemas-catalog.json → sample schemas the demo + Seraph fetch
#   *    /api/<anything>                → FastAPI backend on 127.0.0.1:8000
#                                         (the /api prefix is stripped before
#                                          reaching the backend, so the backend
#                                          keeps its routes: /upload-audio,
#                                          /process-procedure, etc.)
#
# Disk layout on the server:
#   /home/forge/mpa/
#       backend/             ← FastAPI (uvicorn on 127.0.0.1:8000, managed by systemd)
#       sdk/
#           example.html     ← demo at /
#           mpa-sdk.js       ← served at /sdk/mpa-sdk.js
#           mock-seraph/     ← served at /mock-seraph/
#       deploy/              ← this config + systemd unit + DEPLOY.md
#
# After enabling, install SSL:
#   sudo certbot --nginx -d mpa.tomorrow.services

server {
    listen 80;
    listen [::]:80;
    server_name mpa.tomorrow.services;

    # ── Uploads (audio recordings) ───────────────────────────────────────
    client_max_body_size 50M;

    # ── Hide hidden files ────────────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ── Root: serve the SDK demo page ────────────────────────────────────
    # Use root+try_files rather than `alias` to a file — `alias` interacts
    # badly with any `index` directive in scope, producing requests for
    # `example.htmlindex.html` that fail with 500. (Bit us in production.)
    location = / {
        root /home/forge/mpa/sdk;
        try_files /example.html =404;
        default_type text/html;
        # Don't aggressively cache the demo — handy when iterating.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── The SDK file Seraph (and the demo) loads ─────────────────────────
    # Crucial: open CORS so Seraph can fetch from a different origin.
    location = /sdk/mpa-sdk.js {
        alias /home/forge/mpa/sdk/mpa-sdk.js;
        default_type application/javascript;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ── Anything else under /sdk/ (CSS, future files) ────────────────────
    location /sdk/ {
        alias /home/forge/mpa/sdk/;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Mock Seraph schemas catalog (used by the demo; can be removed
    #    later when the real Seraph hosts these schemas itself) ──────────
    location /mock-seraph/ {
        alias /home/forge/mpa/sdk/mock-seraph/;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ── Health check (cheap, no proxy) ───────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Backend API ──────────────────────────────────────────────────────
    # Browser calls /api/upload-audio → backend receives /upload-audio.
    location /api/ {
        # Strip the /api prefix before forwarding.
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Whisper + transformers + Qwen can take 30-60s on CPU. Be generous.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # Don't buffer large streamed responses or uploads.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
