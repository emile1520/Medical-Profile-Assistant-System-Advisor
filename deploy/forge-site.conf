# ─────────────────────────────────────────────────────────────────────────────
# Forge-managed nginx site config for mpa.tomorrow.services
# This is the ACTUAL config running in production (verified 2026-05-20).
#
# IMPORTANT — this file is NOT installed as a standalone nginx site!
# It gets dropped into Forge's per-site include path:
#     /etc/nginx/forge-conf/<site-id>/site.conf
#
# Forge wraps it with its own server { ... } block (configured via the Forge
# dashboard) that sets the listen ports, server_name, SSL certs, and the
# include directives. Don't try to add `server { }` or `listen` here — that
# breaks the wrapper.
#
# If you're deploying to a NON-Forge server, use deploy/nginx-mpa.conf instead
# (it's the same routing, just wrapped in a complete server block).
#
# How to install (one-time, on the server):
#     # Find the site ID Forge assigned (look for the include in
#     # /etc/nginx/sites-available/mpa.tomorrow.services):
#     SITE_ID=$(grep -oP 'forge-conf/\K[0-9]+' \
#         /etc/nginx/sites-available/mpa.tomorrow.services | head -1)
#
#     sudo cp /home/forge/mpa/deploy/forge-site.conf \
#             /etc/nginx/forge-conf/$SITE_ID/site.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# Lessons learned the hard way (kept here so the next person avoids them):
#   1. The OUTER Forge server block sets `index index.html index.htm;` which
#      makes nginx APPEND `index.html` to any `alias` that points at a file.
#      That turns `alias .../example.html` into a request for
#      `.../example.htmlindex.html` and returns 500. The fix is to use
#      `root` + `try_files` for the root location instead of `alias`.
#      See the `location = /` block below.
#
#   2. nginx runs as `www-data` and needs execute (`x`) permission on every
#      parent directory between `/` and the files it serves. Run once:
#           chmod o+x /home/forge /home/forge/mpa /home/forge/mpa/sdk
#      Otherwise you'll get 403 Forbidden on every request.
#
#   3. Forge already provisioned the SSL cert via its dashboard ("LetsEncrypt"
#      or "Existing Certificate"). DON'T run certbot manually — it'll either
#      fight with Forge's cert paths or just be redundant. The cert lives at
#      /etc/nginx/ssl/domains/<a>/<b>/server.{crt,key}.
#
#   4. HTTP→HTTPS redirect is also handled by Forge automatically, via
#      /etc/nginx/forge-conf/<site-id>/<domain>/before/ssl_redirect.conf.
#      No need to add a port-80 server block here.
# ─────────────────────────────────────────────────────────────────────────────

# ── TLS settings (kept identical to Forge's default for safety) ─────────────
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparams.pem;

# ── Security headers ─────────────────────────────────────────────────────────
add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";

index index.html index.htm;
charset utf-8;

# Forge's own server-level includes (rate limits, etc.) — leave this alone.
include forge-conf/3204929/server/*;

# ── MPA: allow audio uploads up to 50 MB ────────────────────────────────────
client_max_body_size 50M;

# ── MPA: root URL serves the SDK demo page ──────────────────────────────────
# Uses root+try_files (NOT alias) to avoid the `index` directive bug — see
# lesson #1 in the header comment above.
location = / {
    root /home/forge/mpa/sdk;
    try_files /example.html =404;
    default_type text/html;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# ── MPA: the SDK file Seraph loads (CORS open so cross-origin works) ────────
location = /sdk/mpa-sdk.js {
    alias /home/forge/mpa/sdk/mpa-sdk.js;
    default_type application/javascript;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
}

# ── MPA: anything else under /sdk/ ──────────────────────────────────────────
location /sdk/ {
    alias /home/forge/mpa/sdk/;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── MPA: mock Seraph schemas catalog (used by the demo + early integration) ─
# Remove this location once Seraph hosts the canonical schemas itself.
location /mock-seraph/ {
    alias /home/forge/mpa/sdk/mock-seraph/;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
}

# ── MPA: cheap health check ─────────────────────────────────────────────────
location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# ── MPA: API proxy to FastAPI backend on 127.0.0.1:8000 ─────────────────────
# Strips the /api prefix so the backend keeps its existing routes.
# Returns 502 until Phase 2 (backend systemd service) is up.
location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    # Whisper + transformers + Qwen can take 30-60s on CPU. Be generous.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /favicon.svg { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }

access_log off;
error_log  /var/log/nginx/3204929-error.log error;

# Deny dotfiles (matches things like /.env, /.git, etc.) except .well-known
# which is needed for ACME / Let's Encrypt challenges.
location ~ /\.(?!well-known).* {
    deny all;
}
